<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Registro de llamadas</title>
  <link rel="stylesheet" href="estilos.css?v=4">
</head>
<body class="pagina-login">
  <main class="login">
    <div class="login__marca">
      <span class="barra__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      </span>
      <span class="barra__titulo">Registro de llamadas</span>
    </div>

    <!-- paso 1: ingresar -->
    <form id="form-login" class="tarjeta login__tarjeta" novalidate>
      <h1>Ingresar</h1>
      <p class="sub">Use su usuario (cédula) y contraseña.</p>
      <div class="campo">
        <label for="l-usuario">Usuario</label>
        <input id="l-usuario" name="usuario" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </div>
      <div class="campo">
        <label for="l-clave">Contraseña</label>
        <div class="clave">
          <input id="l-clave" name="clave" type="password" autocomplete="current-password" required>
          <button type="button" class="clave__ver" data-para="l-clave" aria-label="Mostrar contraseña">Ver</button>
        </div>
      </div>
      <p class="login__error" id="error-login" role="alert" hidden></p>
      <button type="submit" class="boton boton--primario boton--ancho" id="btn-ingresar">Ingresar</button>
    </form>

    <!-- paso 2: cambiar contraseña (primer ingreso o contraseña restablecida) -->
    <form id="form-cambio" class="tarjeta login__tarjeta" novalidate hidden>
      <h1>Cree su contraseña</h1>
      <p class="sub">Hola <strong id="nombre-cambio"></strong>. Por seguridad, cambie la contraseña inicial antes de continuar.</p>
      <div class="campo">
        <label for="c-actual">Contraseña actual</label>
        <input id="c-actual" name="actual" type="password" autocomplete="current-password" required>
      </div>
      <div class="campo">
        <label for="c-nueva">Nueva contraseña</label>
        <div class="clave">
          <input id="c-nueva" name="nueva" type="password" autocomplete="new-password" minlength="6" required>
          <button type="button" class="clave__ver" data-para="c-nueva" aria-label="Mostrar contraseña">Ver</button>
        </div>
        <small class="ayuda">Mínimo 6 caracteres, diferente a su usuario.</small>
      </div>
      <div class="campo">
        <label for="c-repetir">Repita la nueva contraseña</label>
        <input id="c-repetir" name="repetir" type="password" autocomplete="new-password" required>
      </div>
      <p class="login__error" id="error-cambio" role="alert" hidden></p>
      <button type="submit" class="boton boton--primario boton--ancho">Guardar y continuar</button>
      <button type="button" class="enlace-sutil login__salir" id="btn-salir-cambio">Salir</button>
    </form>
  </main>
  <script src="login.js?v=4"></script>
</body>
</html>
